<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سباق السيارات إلى حرف ف</title>
<style>
:root{--bg:#bfe6ff;--ink:#1f2a44;--card:#fff;--accent:#ff7a1a;--ok:#22a84a;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16213a;--ink:#f1f5ff;--card:#2b3a5c}}
:root[data-theme="dark"]{--bg:#16213a;--ink:#f1f5ff;--card:#2b3a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none}
h1{font-size:clamp(20px,4.5vw,32px);margin:12px 10px 2px;text-align:center}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 10px}
.pill{background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:700;font-size:clamp(15px,3.6vw,20px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
#pts{background:#ffd23f;color:#3a2a00;font-size:clamp(18px,4.4vw,26px)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:8px 18px;font-size:clamp(16px,3.6vw,20px);background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(2px)}
#msg{font-size:clamp(19px,4.4vw,28px);min-height:42px;text-align:center;margin:4px 10px;font-weight:700}
.stage{position:relative;width:min(100%,900px);height:clamp(310px,58vh,430px);margin:4px auto;direction:ltr;overflow:hidden;border-radius:24px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.edge{stroke:#fff;stroke-width:56px}
.rd{stroke-width:46px}
.dash{stroke:#ffd23f;stroke-width:4px;stroke-dasharray:14 12}
.edge,.rd,.dash{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:clamp(22px,5vw,36px);opacity:.9}
.station{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.card{width:clamp(64px,15vw,100px);height:clamp(72px,17vw,116px);background:var(--card);color:var(--ink);border:5px solid var(--accent);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,10vw,70px);font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.s5 .card{width:clamp(52px,12.5vw,86px);height:clamp(62px,14.5vw,100px);font-size:clamp(34px,8.5vw,58px)}
.post{width:8px;height:clamp(14px,4vh,26px);background:#8a5a2b}
.station.ok .card{border-color:var(--ok);background:#d6f7de;color:#14532d}
.station.no .card{animation:shake .4s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#car{position:absolute;font-size:clamp(40px,10vw,64px);transform:translate(-50%,-62%);line-height:1;z-index:3;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
#car.bounce{animation:hop .5s 2}
@keyframes hop{50%{transform:translate(-50%,-90%) rotate(-6deg)}}
.plus{position:absolute;z-index:4;transform:translate(-50%,-100%);font-size:clamp(26px,6vw,40px);font-weight:800;color:#ffd23f;text-shadow:0 2px 0 #7a4a00,0 0 8px #fff;animation:up 1.1s forwards;pointer-events:none}
@keyframes up{to{transform:translate(-50%,-260%);opacity:0}}
.hint{font-size:15px;opacity:.85;margin:4px 10px 14px;text-align:center}
#fin{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:9}
#fin div{background:var(--card);color:var(--ink);padding:26px 32px;border-radius:26px;text-align:center;max-width:90%}
#fin h2{font-size:clamp(24px,6vw,38px);margin:0 0 8px}
</style>
</head>
<body>
<h1>🏁 سباق السيارات إلى حرف «ف» 🏁</h1>
<div class="bar">
  <span class="pill" id="pts">⭐ النقاط: 0</span>
  <span class="pill" id="stg"></span>
  <span class="pill" id="rnd"></span>
  <button id="hear">🔊 اسمع الحرف</button>
</div>
<div id="msg"></div>
<div class="stage" id="stage"></div>
<div class="hint">ابحث عن حرف ف، ثم اضغط على بطاقته لتسير سيارتك إليه.</div>
<div id="fin"><div><h2 id="ft"></h2><div style="font-size:44px" id="fs"></div><p style="font-size:20px;margin:8px 0 14px" id="fp"></p><button id="fb"></button></div></div>
<script>
(function(){
var PER=3, si=0, round=0, score=0, attempts=0, busy=false, V=[], car=null;
var easy=["م","ب","د","و","ل","س","ر","ح"], hard=["ق","غ","ث","ن","ع","ك"];
var STAGES=[
 {name:"الطريق المستقيم",sky:"#bfe6ff",ground:"#7ed37a",road:"#4a4f5c",n:3,
  V:[[100,76],[78,76],[52,76],[26,76],[2,76]],S:[1,2,3],pool:easy,
  deco:[["🌳",10,50],["☁️",30,12],["🌳",90,52],["☁️",72,16],["🌷",50,94],["🌳",58,50]]},
 {name:"الطريق المتعرج",sky:"#ffe2b8",ground:"#e8c26a",road:"#5a4a3a",n:4,
  V:[[100,82],[80,82],[62,52],[44,52],[26,82],[8,82]],S:[1,2,3,4],pool:easy.concat(["ق","ن"]),
  deco:[["🌵",12,40],["☀️",86,14],["🌵",90,60],["🐪",50,24],["🌵",44,95]]},
 {name:"طريق الجبل",sky:"#cfe3ff",ground:"#9bb0a0",road:"#3d4350",n:4,
  V:[[100,90],[80,90],[62,72],[44,72],[26,56],[8,56]],S:[1,2,3,4],pool:hard,
  deco:[["⛰️",16,24],["🏔️",50,18],["⛰️",84,28],["🌲",90,60],["🌲",10,92],["☁️",70,10]]},
 {name:"مدينة الليل",sky:"#12204a",ground:"#2b3b52",road:"#20232b",n:5,
  V:[[100,80],[82,80],[64,52],[46,80],[28,52],[10,80]],S:[1,2,3,4,5],pool:hard.concat(["م","د"]),
  deco:[["🌙",86,12],["🏙️",20,16],["✨",50,10],["🏢",70,22],["🏙️",92,48],["⭐",34,8]]}
];

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var voice=null;
function pickVoice(){try{var v=speechSynthesis.getVoices();for(var i=0;i<v.length;i++){if(/^ar/i.test(v[i].lang)){voice=v[i];break}}}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
var noted=false;
function note(hard){
  if(noted)return;noted=true;
  var h=document.querySelector(".hint");
  if(h)h.textContent=hard?"جهازك أو المتصفح لا يدعم النطق الصوتي. جرّب Chrome أو Safari وتأكد من رفع الصوت.":"إن لم تسمع الصوت: ثبّت صوتًا عربيًا من إعدادات النطق في جهازك وارفع الصوت.";
}
function say(text,rate,cb){
  var done=false;function fin(){if(!done){done=true;cb&&cb()}}
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){throw 1}
    pickVoice();
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel()}
    var u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:"ar-SA";if(voice)u.voice=voice;u.rate=rate||0.7;u.pitch=1.1;u.volume=1;
    u.onend=fin;u.onerror=fin;
    try{speechSynthesis.resume()}catch(e){}
    setTimeout(function(){speechSynthesis.speak(u)},60);
    setTimeout(fin,4500);
    if(!voice){note()}
  }catch(e){note(true);beep([660,880],.2);setTimeout(fin,600)}
}
var ac=null;
function beep(freqs,dur){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime;
    freqs.forEach(function(f,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.frequency.value=f;o.type="triangle";o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.18,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur);
      o.start(t+i*dur);o.stop(t+i*dur+dur);
    });
  }catch(e){}
}
var stageEl=document.getElementById("stage"), msg=document.getElementById("msg");
function hud(){
  document.getElementById("pts").textContent="⭐ النقاط: "+score;
  document.getElementById("stg").textContent="المرحلة "+(si+1)+" من "+STAGES.length+" · "+STAGES[si].name;
  var d="";for(var i=0;i<PER;i++)d+=(i<round?"🟢":"⚪");
  document.getElementById("rnd").textContent="الجولات: "+d;
}
function place(el,p){el.style.left=p[0]+"%";el.style.top=p[1]+"%"}
function build(){
  var S=STAGES[si];V=S.V;busy=false;attempts=0;
  stageEl.className="stage"+(S.n>=5?" s5":"");
  stageEl.style.background="linear-gradient("+S.sky+" 0 34%,"+S.ground+" 34%)";
  var pts=V.map(function(p){return p[0]+","+p[1]}).join(" ");
  var h='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline class="edge" points="'+pts+'"/><polyline class="rd" stroke="'+S.road+'" points="'+pts+'"/><polyline class="dash" points="'+pts+'"/></svg>';
  S.deco.forEach(function(d){h+='<div class="deco" style="left:'+d[1]+'%;top:'+d[2]+'%">'+d[0]+'</div>'});
  stageEl.innerHTML=h;
  var letters=shuffle(S.pool.slice()).slice(0,S.n-1);letters.push("ف");shuffle(letters);
  letters.forEach(function(L,i){
    var k=S.S[i],st=document.createElement("div");
    st.className="station";place(st,V[k]);
    st.innerHTML='<div class="card">'+L+'</div><div class="post"></div>';
    st.addEventListener("click",function(){choose(st,L,k)});
    stageEl.appendChild(st);
  });
  car=document.createElement("div");car.id="car";car.textContent="🚗";
  place(car,V[0]);stageEl.appendChild(car);
  hud();
  msg.textContent="اضغط على المحطة التي فيها حرف «ف»";
  setTimeout(function(){say("أين حرف فَ؟",0.8)},300);
}
function drive(seq,ms,cb){
  var i=0;
  (function step(){
    if(i>=seq.length){cb&&cb();return}
    var p=V[seq[i++]];
    car.style.transition="left "+ms+"ms linear, top "+ms+"ms linear";
    place(car,p);
    setTimeout(step,ms+30);
  })();
}
function plus(n,p){
  var e=document.createElement("div");e.className="plus";e.textContent="+"+n;place(e,p);
  stageEl.appendChild(e);setTimeout(function(){e.remove()},1200);
}
function choose(st,L,k){
  if(busy)return;busy=true;attempts++;
  var go=[];for(var i=1;i<=k;i++)go.push(i);
  drive(go,430,function(){
    if(L==="ف"){
      var gain=attempts===1?10:5;score+=gain;round++;
      st.classList.add("ok");car.classList.add("bounce");
      plus(gain,V[k]);hud();
      beep([523,659,784,1046],.12);
      msg.textContent=(attempts===1?"ممتاز! هذا حرف ف 🎉":"أحسنت! وجدته 🎉");
      say("فَ، فَ، فَرَاشَة",0.7,function(){car.classList.remove("bounce");setTimeout(next,500)});
    }else{
      st.classList.add("no");beep([220,180],.18);
      msg.textContent="هذا ليس ف، حاول مرة أخرى 💪";
      say("حاول مرة أخرى",0.8);
      setTimeout(function(){
        st.classList.remove("no");
        var back=[];for(var j=k-1;j>=0;j--)back.push(j);
        drive(back,260,function(){busy=false});
      },800);
    }
  });
}
function showFin(title,stars,sub,btn,fn){
  document.getElementById("ft").textContent=title;
  document.getElementById("fs").textContent=stars;
  document.getElementById("fp").textContent=sub;
  var b=document.getElementById("fb");b.textContent=btn;
  b.onclick=function(){document.getElementById("fin").style.display="none";fn()};
  document.getElementById("fin").style.display="flex";
}
function next(){
  if(round<PER){build();return}
  score+=20;hud();beep([523,659,784,1046,1318],.15);
  if(si<STAGES.length-1){
    showFin("أكملت المرحلة "+(si+1)+"! 🏆","⭐⭐⭐","مكافأة المرحلة: +20 نقطة · مجموعك "+score,"المرحلة التالية ◀",function(){si++;round=0;build()});
    say("أحسنت",0.8);
  }else{
    var best=0;
    try{best=parseInt(localStorage.getItem("faa_best")||"0",10)||0;if(score>best){best=score;localStorage.setItem("faa_best",String(best))}}catch(e){best=Math.max(best,score)}
    var stars=score>=160?"⭐⭐⭐":score>=110?"⭐⭐":"⭐";
    showFin("أنت بطل السباق! 🥇",stars,"مجموع نقاطك "+score+" · أفضل نتيجة "+best,"العب مرة أخرى",function(){si=0;round=0;score=0;build()});
    say("أحسنت يا بطل",0.8);
  }
}
document.getElementById("hear").addEventListener("click",function(){beep([784],.08);say("فَ، فَ، فَ. فِيل",0.7)});
build();
})();
</script>
</body>
</html>
